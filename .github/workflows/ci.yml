name: ci
on:
  push: {branches: [main]}
  pull_request:
  # Weekly, so a newly published Go standard-library vulnerability in the minimum supported
  # toolchain shows up even when nothing is merged (see the vuln-min-go job).
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read

# The cexy-api-spec commit the spec and conformance tests run against. Pinned so that a spec
# change cannot silently change what CI tests; bump it in a reviewed PR.
env:
  SPEC_COMMIT: 0d2723609108c635e1566e03d297e36b6d9be8de

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: cexy-go}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-go, fetch-depth: 0, persist-credentials: false}
      # The shared spec and conformance cases live in cexy-api-spec, checked out next to this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: cexyio/cexy-api-spec, ref: "${{ env.SPEC_COMMIT }}", path: cexy-api-spec, persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: "1.27.x", cache-dependency-path: cexy-go/go.sum}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install pyyaml==6.0.2
      - name: Generated code matches the spec (drift check)
        run: python3 tools/generate.py --check
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Module checksums
        run: go mod verify
      - name: Known vulnerabilities (govulncheck, pinned)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: No internal references
        env:
          SCAN_PATTERNS: ${{ secrets.SCAN_PATTERNS }}
        run: |
          printf '%s\n' "$SCAN_PATTERNS" > "$RUNNER_TEMP/scan-patterns.txt"
          CEXY_SCAN_PATTERNS_FILE="$RUNNER_TEMP/scan-patterns.txt" python3 tools/scan_internal.py .
      - name: Scanner matches cexy-api-spec
        run: cmp tools/scan_internal.py ../cexy-api-spec/tools/scan_internal.py
      - name: Secret scan (gitleaks 8.21.2, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --no-banner --redact

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two supported Go releases; go.mod's minimum is the older one.
        go: ["1.26.x", "1.27.x"]
    defaults:
      run: {working-directory: cexy-go}
    env:
      CEXY_REQUIRE_SPEC: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-go, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: cexyio/cexy-api-spec, ref: "${{ env.SPEC_COMMIT }}", path: cexy-api-spec, persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: "${{ matrix.go }}", cache-dependency-path: cexy-go/go.sum}
      - name: Unit, conformance and WebSocket tests (offline, race detector)
        run: go test -race -count=1 ./...

  # CexyQA's consumer-build rule: build and run a separate module that depends on this one the way
  # a user's program does (via a replace to this checkout), so nothing test-only can mask a gap.
  consumer:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: cexy-go/ci/consumer}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-go, persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: "1.26.x", cache-dependency-path: cexy-go/ci/consumer/go.sum}
      - name: Build as a dependency
        run: go build ./...
      - name: Run (offline smoke; no live call in CI)
        run: go run .

  # govulncheck with the MINIMUM Go that go.mod allows (its `go` directive), not the newest: users
  # may build with that version, so its standard library must be free of known vulnerabilities
  # the SDK reaches. A failure means the floor is stale: raise the `go` directive to the fixed
  # patch release. Not a required check, so a newly published advisory does not block unrelated
  # PRs; the weekly schedule surfaces it.
  vuln-min-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run: {working-directory: cexy-go}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-go, persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: cexy-go/go.mod, cache-dependency-path: cexy-go/go.sum}
      - name: Go version is the go.mod minimum
        run: |
          want="go$(awk '$1 == "go" {print $2; exit}' go.mod)"
          have="$(go env GOVERSION)"
          echo "go.mod minimum: $want; toolchain: $have"
          test "$have" = "$want"
      - name: Known vulnerabilities at the minimum Go (govulncheck, pinned)
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... | tee "$RUNNER_TEMP/govulncheck.txt"
      # Handed to security-floor-issue, the only job that may write issues.
      - name: Keep the govulncheck output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govulncheck-min-go
          path: ${{ runner.temp }}/govulncheck.txt
          if-no-files-found: ignore
          retention-days: 7

  # A red scheduled run only emails whoever last edited the schedule, so when the weekly
  # vuln-min-go run fails, this job opens (or updates) one issue labelled security-floor,
  # visible in the repository. It is the only job with issues: write, and it runs no build,
  # test or scanner: it reads go.mod and the govulncheck output handed over by vuln-min-go.
  security-floor-issue:
    needs: vuln-min-go
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-go, persist-credentials: false, sparse-checkout: go.mod, sparse-checkout-cone-mode: false}
      - name: Fetch the govulncheck output
        continue-on-error: true # absent when vuln-min-go failed before govulncheck ran
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: govulncheck-min-go
          path: ${{ runner.temp }}/govulncheck
      - name: Open or update the security-floor issue
        working-directory: cexy-go
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          floor="$(awk '$1 == "go" {print $2; exit}' go.mod)"
          {
            echo "govulncheck reports known vulnerabilities for the minimum Go that go.mod allows (go $floor)."
            echo "Users may build the SDK with that toolchain. Raise the \`go\` directive in go.mod (and ci/consumer/go.mod)"
            echo "to the patch release that fixes them, note it in the CHANGELOG under Security, and release."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/govulncheck/govulncheck.txt" 2>/dev/null || echo "(no govulncheck output: the job failed earlier)"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          gh label create security-floor --color B60205 --description "Minimum Go has known stdlib vulnerabilities" 2>/dev/null || true
          existing=$(gh issue list --label security-floor --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/issue.md"
            gh issue comment "$existing" --body "Still failing as of $(date -u +%Y-%m-%d): $RUN_URL"
          else
            gh issue create --title "Minimum Go (go $floor) has known vulnerabilities: raise the floor" \
              --label security-floor --body-file "$RUNNER_TEMP/issue.md"
          fi
